<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>EGT — REDARC style | Patrol Y60</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#111820;color:#e8f5ff;font:14px system-ui,Arial;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:16px}canvas{width:min(92vw,560px);aspect-ratio:1;display:block}section{width:min(92vw,520px);background:#1b2732;padding:14px;border-radius:14px}label{display:flex;justify-content:space-between;margin-bottom:8px}input{width:100%;accent-color:#55c8f4}button{border:1px solid #567184;background:#253d4c;color:white;border-radius:8px;padding:9px 12px;margin:8px 4px 0 0}button.active{background:#15668c}small{color:#b6c8d5;text-align:center}</style></head><body><canvas id="g" width="720" height="720" aria-label="Wskaźnik EGT"></canvas><section><label>Temperatura EGT <b id="value">350°C</b></label><input id="temp" type="range" min="0" max="1000" value="350" step="1"><div><button id="auto">Symulacja AUTO</button><button id="idle">Bieg jałowy</button><button id="load">Obciążenie</button><button id="alarm">Alarm</button></div></section><small>Symulacja graficzna · ekran docelowy Waveshare ESP32-S3 360 × 360</small><script>
const c=document.getElementById('g'),x=c.getContext('2d'),slider=document.getElementById('temp'),value=document.getElementById('value');let target=350,actual=350,auto=false,phase=0,last=performance.now();const C=360,rad=Math.PI/180;
function arc(r,a,b,col,w){x.beginPath();x.arc(0,0,r,a*rad,b*rad);x.strokeStyle=col;x.lineWidth=w;x.stroke()}
function txt(t,px,py,size,color='#061a27',weight=700,font='Arial'){x.fillStyle=color;x.font=`${weight} ${size}px ${font}`;x.textAlign='center';x.textBaseline='middle';x.fillText(t,px,py)}
function draw(now){let dt=Math.min(.06,(now-last)/1000);last=now;if(auto){phase+=dt;target=Math.max(0,Math.min(1000,420+245*Math.sin(phase*.42)+85*Math.sin(phase*1.4)))}actual+=(target-actual)*Math.min(1,dt*3.8);value.textContent=Math.round(actual)+'°C';slider.value=Math.round(target);x.setTransform(2,0,0,2,0,0);x.clearRect(0,0,360,360);x.save();x.translate(180,180);
// metal rim
let rim=x.createRadialGradient(-35,-45,115,0,0,180);rim.addColorStop(0,'#9ca5a9');rim.addColorStop(.79,'#141c20');rim.addColorStop(.86,'#eef1f0');rim.addColorStop(.90,'#6d777b');rim.addColorStop(.95,'#222b2f');rim.addColorStop(1,'#bdc5c6');x.fillStyle=rim;x.beginPath();x.arc(0,0,179,0,Math.PI*2);x.fill();arc(168,0,360,'#10191d',10);arc(157,0,360,'#4a5e69',1);
// black outer face and icy blue illuminated face
x.fillStyle='#001521';x.beginPath();x.arc(0,0,153,0,Math.PI*2);x.fill();let face=x.createRadialGradient(-22,-20,12,0,0,126);face.addColorStop(0,'#d2f0ff');face.addColorStop(.7,'#a5dcff');face.addColorStop(1,'#5ebbe9');x.fillStyle=face;x.beginPath();x.arc(0,0,126,0,Math.PI*2);x.fill();
// scale from lower left to lower right via upper semicircle
const start=137,end=401;function angle(v){return (start+(end-start)*v/1000)*rad}function point(r,a){return [Math.cos(a)*r,Math.sin(a)*r]}
// Arc (start to end traverses lower-left -> upper -> lower-right via increasing angle? canvas y positive: 137=lower left, 401=lower right via bottom. use negative sweep)
const sa=137,ea=-137;function ang(v){return (sa+(ea-sa)*v/1000)*rad}
for(let i=0;i<100;i++){let a=ang(i*10),b=ang((i+1)*10);x.beginPath();x.arc(0,0,99,a,b,true);x.strokeStyle=i>=70?'#ad2955':'#13b8e8';x.lineWidth=10;x.stroke()}
for(let i=0;i<=20;i++){let a=ang(i*50),major=i%2===0;let [ax,ay]=point(major?95:104,a),[bx,by]=point(major?116:114,a);x.beginPath();x.moveTo(ax,ay);x.lineTo(bx,by);x.lineWidth=major?5:2.5;x.strokeStyle='#062338';x.stroke()}
for(let i=0;i<=10;i++){let a=ang(i*100),[px,py]=point(79,a);txt(String(i),px,py,21,'#07273b',800)}
// Branding and labels, based on supplied dial
txt('THE POWER OF',0,-76,8,'#12405a',800);x.fillStyle='#a62c57';x.fillRect(-38,-66,76,19);txt('REDARC',0,-56,17,'#e9eff9',900);txt('EGT',-58,13,19,'#07283b',900);txt('X100',-58,29,14,'#07283b',800);
// digit area: EGT numeric readout in °C, preserving visual placement
// Compact digital reading inside the lower dial, clear of the scale and centre hub
const digital=String(Math.round(actual));txt(digital,0,91,31,'#063052',600,'monospace');txt('°C',53,94,11,'#063052',800);txt('EGT',0,113,9,'#063052',800);
// needle blue dark, drawn last, red warning pulse on pivot
let a=ang(actual),[nx,ny]=point(105,a),[tx,ty]=point(22,a+Math.PI);x.beginPath();x.moveTo(tx,ty);x.lineTo(nx,ny);x.strokeStyle='#1278a6';x.lineWidth=4;x.lineCap='round';x.stroke();x.beginPath();x.arc(0,0,32,0,Math.PI*2);x.fillStyle='#1388bd';x.fill();x.beginPath();x.arc(0,0,21,0,Math.PI*2);x.fillStyle='#a7dfff';x.fill();if(actual>=800){x.beginPath();x.arc(0,0,122,0,Math.PI*2);x.strokeStyle=Math.floor(now/300)%2?'#e83b50':'#ffbdc8';x.lineWidth=4;x.stroke()}x.restore();requestAnimationFrame(draw)}requestAnimationFrame(draw);
slider.addEventListener('input',()=>{auto=false;target=+slider.value;document.getElementById('auto').classList.remove('active')});function set(t){auto=false;target=t;document.getElementById('auto').classList.remove('active')}document.getElementById('auto').onclick=()=>{auto=!auto;document.getElementById('auto').classList.toggle('active',auto)};document.getElementById('idle').onclick=()=>set(220);document.getElementById('load').onclick=()=>set(680);document.getElementById('alarm').onclick=()=>set(900);
</script></body></html>
