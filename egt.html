<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patrol Y60 – EGT REDARC</title><style>body{margin:0;background:#111923;color:#d8efff;font:14px system-ui;display:flex;justify-content:center}.wrap{width:min(100%,440px);padding:12px;box-sizing:border-box}canvas{width:100%;aspect-ratio:1;display:block}input{width:100%;accent-color:#27b9e8}button{padding:9px 12px;border-radius:8px;background:#29485c;color:white;border:1px solid #54758a;cursor:pointer}.controls{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.heading{display:flex;justify-content:space-between;margin-bottom:8px}</style></head><body><main class="wrap"><canvas id="dial" width="720" height="720"></canvas><div class="heading"><span>Temperatura EGT</span><strong id="reading">350°C</strong></div><input id="slider" type="range" min="0" max="1000" value="350"><div class="controls"><button data-t="200">Jałowy</button><button data-t="650">Obciążenie</button><button data-t="1000">1000°C</button><button id="auto">AUTO</button></div></main><script>
(()=>{const c=document.querySelector('#dial'),g=c.getContext('2d'),s=document.querySelector('#slider'),v=document.querySelector('#reading');let target=350,current=350,auto=false,phase=0,last=performance.now();const R=Math.PI/180;function arc(rad,a,b,color,w){g.beginPath();g.arc(0,0,rad,a,b);g.strokeStyle=color;g.lineWidth=w;g.stroke()}function text(t,x,y,size,color='#092d45',weight=700,family='Arial'){g.fillStyle=color;g.font=`${weight} ${size}px ${family}`;g.textAlign='center';g.textBaseline='middle';g.fillText(t,x,y)}function angle(t){return (137-274*t/1000)*R}function point(d,a){return [d*Math.cos(a),d*Math.sin(a)]}function frame(time){const dt=Math.min(.06,(time-last)/1000);last=time;if(auto){phase+=dt;target=Math.max(0,Math.min(1000,450+250*Math.sin(phase*.6)+90*Math.sin(phase*1.4)))}current+=(target-current)*Math.min(1,dt*4);v.textContent=Math.round(current)+'°C';s.value=Math.round(target);g.setTransform(2,0,0,2,0,0);g.clearRect(0,0,360,360);g.save();g.translate(180,180);let rim=g.createRadialGradient(-25,-30,125,0,0,180);rim.addColorStop(0,'#bec8ca');rim.addColorStop(.8,'#263139');rim.addColorStop(.86,'#f1f3f3');rim.addColorStop(.91,'#6a777b');rim.addColorStop(.97,'#222d32');rim.addColorStop(1,'#bbc3c5');g.fillStyle=rim;g.beginPath();g.arc(0,0,179,0,Math.PI*2);g.fill();arc(166,0,Math.PI*2,'#172b36',10);g.fillStyle='#001824';g.beginPath();g.arc(0,0,151,0,Math.PI*2);g.fill();let face=g.createRadialGradient(-22,-24,10,0,0,130);face.addColorStop(0,'#d4f1ff');face.addColorStop(.65,'#a6ddff');face.addColorStop(1,'#5db9e7');g.fillStyle=face;g.beginPath();g.arc(0,0,126,0,Math.PI*2);g.fill();for(let i=0;i<100;i++){g.beginPath();g.arc(0,0,99,angle(i*10),angle((i+1)*10),true);g.strokeStyle=i>=70?'#ac2e57':'#16bce9';g.lineWidth=10;g.stroke()}for(let i=0;i<=20;i++){let a=angle(i*50),major=i%2===0,p=point(major?96:105,a),q=point(major?116:114,a);g.beginPath();g.moveTo(...p);g.lineTo(...q);g.strokeStyle='#082c42';g.lineWidth=major?5:2.5;g.stroke()}for(let i=0;i<=10;i++){let p=point(79,angle(i*100));text(i.toString(),p[0],p[1],21)}text('THE POWER OF',0,-58,7,'#13405d',800);g.fillStyle='#a92e59';g.fillRect(-31,-50,62,16);text('REDARC',0,-41,13,'#f3e9f0',900);text('EGT',-58,-8,18,'#092a40',900);text('X100',-58,10,14,'#092a40',800);text(String(Math.round(current)),0,46,23,'#073e65',700,'monospace');text('°C',current>=999?39:29,47,10,'#073e65',800);let a=angle(current),p=point(105,a),q=point(21,a+Math.PI);g.beginPath();g.moveTo(...q);g.lineTo(...p);g.strokeStyle='#1479a8';g.lineWidth=4;g.lineCap='round';g.stroke();g.beginPath();g.arc(0,0,32,0,Math.PI*2);g.fillStyle='#1389bc';g.fill();g.beginPath();g.arc(0,0,21,0,Math.PI*2);g.fillStyle='#b0e2ff';g.fill();if(current>=800){arc(122,0,Math.PI*2,Math.floor(time/350)%2?'#ff4862':'#ffd5dd',3)}g.restore();requestAnimationFrame(frame)}requestAnimationFrame(frame);s.oninput=()=>{auto=false;target=Number(s.value)};document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{auto=false;target=Number(b.dataset.t)});document.querySelector('#auto').onclick=()=>{auto=!auto};})();
</script></body></html>
