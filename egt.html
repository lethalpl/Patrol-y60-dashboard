<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>EGT • Waveshare 360</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0a0d12;color:#eaf0f5;font-family:Arial,Helvetica,sans-serif;display:flex;min-height:100dvh;align-items:center;justify-content:center;flex-direction:column;gap:20px;padding:20px}.gauge{width:min(92vw,440px);aspect-ratio:1;border-radius:50%;position:relative;background:#06090c;box-shadow:0 0 0 7px #171d23,0 0 0 10px #343e47,0 12px 38px #000a;overflow:hidden}.gauge svg{width:100%;height:100%;display:block}.controls{width:min(92vw,440px);padding:16px;border:1px solid #26323b;border-radius:14px;background:#121922}.controls label{font-size:14px;color:#c5d1d9}.controls input[type=range]{width:100%;accent-color:#ec5a38;margin:12px 0}.buttons{display:flex;gap:8px;flex-wrap:wrap}.buttons button{flex:1;background:#27343d;color:#f1f5f7;border:1px solid #3a4c57;border-radius:8px;padding:10px;cursor:pointer}.buttons button.active{background:#c7472c;border-color:#e66c4e}.small{font-size:12px;color:#82939e;text-align:center;max-width:440px;line-height:1.5}.readout{font-variant-numeric:tabular-nums}.warn{animation:pulse 0.65s infinite alternate}@keyframes pulse{to{opacity:.25}}@media(max-height:650px){body{justify-content:flex-start}.gauge{width:min(70vh,92vw)}}
</style></head><body><div class="gauge"><svg viewBox="0 0 360 360" role="img" aria-label="Symulowany wskaźnik EGT"><defs><filter id="glow"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><circle cx="180" cy="180" r="169" fill="#080c10" stroke="#222d34" stroke-width="2"/><circle cx="180" cy="180" r="154" fill="none" stroke="#17232b" stroke-width="1"/><g id="zones"></g><g id="ticks"></g><g id="labels"></g><text x="180" y="107" text-anchor="middle" font-size="17" font-weight="700" letter-spacing="3" fill="#dce5e9">EGT</text><text x="180" y="130" text-anchor="middle" font-size="10" letter-spacing="1.6" fill="#78909c">EXHAUST TEMP</text><text id="number" class="readout" x="180" y="204" text-anchor="middle" font-size="69" font-weight="700" fill="#eef4f6">450</text><text x="180" y="227" text-anchor="middle" font-size="14" fill="#a7b6bd">°C</text><g id="needle" transform="rotate(-45 180 180)"><path d="M180 183 L177 179 L180 45 L183 179 Z" fill="#e9f1f4" filter="url(#glow)"/><circle cx="180" cy="180" r="9" fill="#2d3940" stroke="#e9f1f4" stroke-width="2"/></g><g id="alarm" opacity="0"><rect x="131" y="260" width="98" height="29" rx="7" fill="#8b1e14"/><text x="180" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="white">EGT HIGH</text></g><text x="180" y="315" text-anchor="middle" font-size="9" letter-spacing="2" fill="#677985">SIMULATION</text></svg></div><div class="controls"><label for="temp">Temperatura EGT: <strong id="sliderVal">450°C</strong></label><input id="temp" type="range" min="0" max="1000" step="5" value="450"><div class="buttons"><button id="auto">Auto: WŁ.</button><button id="idle">Jałowe</button><button id="load">Obciążenie</button><button id="peak">Alarm</button></div></div><div class="small">Projekt demonstracyjny 360 × 360 px • skala 0–1000°C • ostrzeżenie od 800°C (próg przykładowy, nie limit silnika). Do działania na ESP32 potrzebny będzie osobny firmware.</div><script>
const NS='http://www.w3.org/2000/svg';const $=id=>document.getElementById(id);const center=180;const angle=v=>-135+270*v/1000;const polar=(r,a)=>{let rad=(a-90)*Math.PI/180;return [center+r*Math.cos(rad),center+r*Math.sin(rad)]};function el(tag,attrs,parent){let n=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));parent.appendChild(n);return n}function arc(r,a,b){let p=polar(r,a),q=polar(r,b);return `M ${p[0]} ${p[1]} A ${r} ${r} 0 ${b-a>180?1:0} 1 ${q[0]} ${q[1]}`}
[[0,650,'#46a5b7'],[650,800,'#e2a642'],[800,1000,'#e14b38']].forEach(([a,b,c])=>el('path',{d:arc(145,angle(a),angle(b)),stroke:c,'stroke-width':6,fill:'none','stroke-linecap':'round'},$('zones')));for(let v=0;v<=1000;v+=25){let a=angle(v),major=v%100===0,p=polar(major?126:133,a),q=polar(140,a),color=v>=800?'#ec6554':v>=650?'#e3b864':'#b5cbd2';el('line',{x1:p[0],y1:p[1],x2:q[0],y2:q[1],stroke:color,'stroke-width':major?2.4:1,opacity:major?1:.65},$('ticks'));if(v%200===0){let xy=polar(110,a),t=el('text',{x:xy[0],y:xy[1]+4,'text-anchor':'middle','font-size':13,'font-weight':600,fill:'#d4e1e7'},$('labels'));t.textContent=v}}
let target=450,display=450,auto=true,t=0;function setTemp(v,manual=false){target=Math.max(0,Math.min(1000,v));if(manual){auto=false;updateButton()}$('temp').value=target;$('sliderVal').textContent=Math.round(target)+'°C'}function updateButton(){$('auto').textContent='Auto: '+(auto?'WŁ.':'WYŁ.');$('auto').classList.toggle('active',auto)}$('temp').addEventListener('input',e=>setTemp(+e.target.value,true));$('auto').onclick=()=>{auto=!auto;updateButton()};$('idle').onclick=()=>setTemp(260,true);$('load').onclick=()=>setTemp(690,true);$('peak').onclick=()=>setTemp(890,true);updateButton();function frame(){t+=.018;if(auto){let wave=Math.sin(t*.5)*190+Math.sin(t*1.13)*72;setTemp(Math.round(510+wave))}display+=(target-display)*.055;let val=Math.round(display);$('number').textContent=val;$('number').setAttribute('fill',val>=800?'#ff725d':'#eef4f6');$('needle').setAttribute('transform',`rotate(${angle(display)} 180 180)`);$('alarm').setAttribute('opacity',val>=800?'1':'0');$('alarm').classList.toggle('warn',val>=800);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
