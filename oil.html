<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patrol Y60 — Oil Pressure REDARC</title><style>body{margin:0;background:#111923;color:#d8efff;font:14px system-ui;display:flex;justify-content:center}.wrap{width:min(100%,480px);padding:14px;box-sizing:border-box;text-align:center}canvas{width:100%;max-width:410px;aspect-ratio:1}input{width:100%;accent-color:#28b8e9}button{padding:9px 12px;margin:4px;border:1px solid #55748a;border-radius:8px;background:#29485c;color:white} .read{display:flex;justify-content:space-between;margin:8px 0}</style></head><body><div class="wrap"><canvas id="dial" width="720" height="720"></canvas><div class="read"><span>Ciśnienie oleju</span><strong id="reading">3.5 bar</strong></div><input id="slider" type="range" min="0" max="100" value="35"><div><button data-v="1.2">Jałowy</button><button data-v="3.5">Jazda</button><button data-v="0.4">Niskie</button><button data-v="7.5">Wysokie</button><button id="auto">AUTO</button></div></div><script>
const g=document.getElementById('dial').getContext('2d'),slider=document.getElementById('slider'),read=document.getElementById('reading');let pressure=3.5,target=3.5,auto=false,phase=0,last=performance.now();const D=Math.PI/180;
function angle(t){return (137-274*t/10)*D}function p(r,a){return [r*Math.cos(a),r*Math.sin(a)]}function line(a,b,w,color){g.beginPath();g.moveTo(...a);g.lineTo(...b);g.lineWidth=w;g.strokeStyle=color;g.stroke()}function txt(t,x,y,size,color='#092d45',weight=700,family='Arial'){g.fillStyle=color;g.font=`${weight} ${size}px ${family}`;g.textAlign='center';g.textBaseline='middle';g.fillText(t,x,y)}
function draw(now){let dt=Math.min(.06,(now-last)/1000);last=now;if(auto){phase+=dt;target=3.3+1.3*Math.sin(phase*.5)+.2*Math.sin(phase*1.8);target=Math.max(.7,Math.min(6,target))}pressure+=(target-pressure)*Math.min(1,dt*3.8);read.textContent=pressure.toFixed(1)+' bar';slider.value=Math.round(target*10);g.setTransform(2,0,0,2,0,0);g.clearRect(0,0,360,360);g.save();g.translate(180,180);
let rim=g.createRadialGradient(-25,-30,125,0,0,180);rim.addColorStop(0,'#bec8ca');rim.addColorStop(.8,'#263139');rim.addColorStop(.86,'#f1f3f3');rim.addColorStop(.91,'#6a777b');rim.addColorStop(.97,'#222d32');rim.addColorStop(1,'#bbc3c5');g.fillStyle=rim;g.beginPath();g.arc(0,0,179,0,Math.PI*2);g.fill();g.beginPath();g.arc(0,0,166,0,Math.PI*2);g.lineWidth=10;g.strokeStyle='#172b36';g.stroke();g.fillStyle='#001824';g.beginPath();g.arc(0,0,151,0,Math.PI*2);g.fill();let face=g.createRadialGradient(-22,-24,10,0,0,130);face.addColorStop(0,'#d4f1ff');face.addColorStop(.65,'#a6ddff');face.addColorStop(1,'#5db9e7');g.fillStyle=face;g.beginPath();g.arc(0,0,126,0,Math.PI*2);g.fill();
for(let i=0;i<100;i++){let a=i/10,b=(i+1)/10;g.beginPath();g.arc(0,0,99,angle(a),angle(b),true);g.strokeStyle=a<.8||a>=7?'#ac2e57':'#16bce9';g.lineWidth=10;g.stroke()}for(let i=0;i<=20;i++){let a=angle(i*.5),major=i%2===0;line(p(major?96:105,a),p(major?116:114,a),major?5:2.5,'#082c42')}for(let i=0;i<=10;i++){let q=p(79,angle(i));txt(String(i),q[0],q[1],21)}
txt('THE POWER OF',0,-58,7,'#13405d',800);g.fillStyle='#a92e59';g.fillRect(-31,-50,62,16);txt('REDARC',0,-41,13,'#f3e9f0',900);txt('OIL',-58,-8,18,'#092a40',900);txt('PRESS',-58,10,13,'#092a40',800);txt(pressure.toFixed(1),0,46,23,'#073e65',700,'monospace');txt('bar',29,47,10,'#073e65',800);
let a=angle(pressure);line(p(21,a+Math.PI),p(105,a),4,'#1479a8');g.beginPath();g.arc(0,0,32,0,Math.PI*2);g.fillStyle='#1389bc';g.fill();g.beginPath();g.arc(0,0,21,0,Math.PI*2);g.fillStyle='#b0e2ff';g.fill();if(pressure<.8||pressure>7){g.beginPath();g.arc(0,0,122,0,Math.PI*2);g.lineWidth=3;g.strokeStyle=Math.floor(now/350)%2?'#ff4862':'#ffd5dd';g.stroke()}g.restore();requestAnimationFrame(draw)}requestAnimationFrame(draw);slider.oninput=()=>{auto=false;target=Number(slider.value)/10};document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{auto=false;target=Number(b.dataset.v);slider.value=Math.round(target*10)});document.getElementById('auto').onclick=()=>auto=!auto;
</script></body></html>
