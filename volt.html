<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patrol Y60 — REDARC Voltage</title><style>body{margin:0;background:#111923;color:#d8efff;font:14px system-ui;display:flex;justify-content:center}main{width:min(100%,480px);padding:14px;box-sizing:border-box}canvas{width:100%;aspect-ratio:1;display:block}section{background:#1c2b38;border-radius:12px;padding:14px}input{width:100%;accent-color:#27b9e8}button{padding:9px 12px;border-radius:8px;background:#29485c;color:white;border:1px solid #54758a;cursor:pointer}nav{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.heading{display:flex;justify-content:space-between;margin-bottom:10px}</style></head><body><main><canvas id="dial" width="720" height="720"></canvas><section><div class="heading"><span>Napięcie instalacji</span><strong id="reading">14.2 V</strong></div><input id="slider" type="range" min="100" max="160" value="142"><nav><button data-v="12.4">Silnik OFF</button><button data-v="14.2">Ładowanie</button><button data-v="11.5">Niskie</button><button data-v="15.5">Za wysokie</button><button id="auto">AUTO</button></nav></section></main><script>
(()=>{const canvas=document.querySelector('#dial'),g=canvas.getContext('2d'),slider=document.querySelector('#slider'),read=document.querySelector('#reading');let voltage=14.2,target=14.2,auto=false,phase=0,last=performance.now();const D=Math.PI/180;
function angle(t){return (137-274*(t-10)/6)*D}function p(r,a){return [r*Math.cos(a),r*Math.sin(a)]}function line(a,b,w,color){g.beginPath();g.moveTo(...a);g.lineTo(...b);g.lineWidth=w;g.strokeStyle=color;g.stroke()}function txt(t,x,y,size,color='#092d45',weight=700,family='Arial'){g.fillStyle=color;g.font=`${weight} ${size}px ${family}`;g.textAlign='center';g.textBaseline='middle';g.fillText(t,x,y)}
function draw(now){let dt=Math.min(.06,(now-last)/1000);last=now;if(auto){phase+=dt;target=14.15+.16*Math.sin(phase*.8)+.07*Math.sin(phase*2.1)}voltage+=(target-voltage)*Math.min(1,dt*3.8);read.textContent=voltage.toFixed(1)+' V';slider.value=Math.round(target*10);g.setTransform(2,0,0,2,0,0);g.clearRect(0,0,360,360);g.save();g.translate(180,180);
let rim=g.createRadialGradient(-25,-30,125,0,0,180);rim.addColorStop(0,'#bec8ca');rim.addColorStop(.8,'#263139');rim.addColorStop(.86,'#f1f3f3');rim.addColorStop(.91,'#6a777b');rim.addColorStop(.97,'#222d32');rim.addColorStop(1,'#bbc3c5');g.fillStyle=rim;g.beginPath();g.arc(0,0,179,0,Math.PI*2);g.fill();g.beginPath();g.arc(0,0,166,0,Math.PI*2);g.lineWidth=10;g.strokeStyle='#172b36';g.stroke();g.fillStyle='#001824';g.beginPath();g.arc(0,0,151,0,Math.PI*2);g.fill();let face=g.createRadialGradient(-22,-24,10,0,0,130);face.addColorStop(0,'#d4f1ff');face.addColorStop(.65,'#a6ddff');face.addColorStop(1,'#5db9e7');g.fillStyle=face;g.beginPath();g.arc(0,0,126,0,Math.PI*2);g.fill();
for(let i=0;i<120;i++){let a=10+i*.05,b=a+.05;g.beginPath();g.arc(0,0,99,angle(a),angle(b),true);g.strokeStyle=a<13.2||a>=14.9?'#ac2e57':'#16bce9';g.lineWidth=10;g.stroke()}for(let i=0;i<=24;i++){let a=angle(10+i*.25),major=i%4===0;line(p(major?96:105,a),p(major?116:114,a),major?5:2.5,'#082c42')}for(let i=10;i<=16;i++){let q=p(79,angle(i));txt(String(i),q[0],q[1],19)}
txt('THE POWER OF',0,-58,7,'#13405d',800);g.fillStyle='#a92e59';g.fillRect(-31,-50,62,16);txt('REDARC',0,-41,13,'#f3e9f0',900);txt('VOLT',-58,-8,17,'#092a40',900);txt('12V',-58,10,14,'#092a40',800);txt(voltage.toFixed(1),0,46,23,'#073e65',700,'monospace');txt('V',34,47,11,'#073e65',800);
let a=angle(voltage);line(p(21,a+Math.PI),p(105,a),4,'#1479a8');g.beginPath();g.arc(0,0,32,0,Math.PI*2);g.fillStyle='#1389bc';g.fill();g.beginPath();g.arc(0,0,21,0,Math.PI*2);g.fillStyle='#b0e2ff';g.fill();if(voltage<12||voltage>15){g.beginPath();g.arc(0,0,122,0,Math.PI*2);g.lineWidth=3;g.strokeStyle=Math.floor(now/350)%2?'#ff4862':'#ffd5dd';g.stroke()}g.restore();requestAnimationFrame(draw)}requestAnimationFrame(draw);
slider.oninput=()=>{auto=false;target=Number(slider.value)/10};document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{auto=false;target=Number(b.dataset.v);slider.value=Math.round(target*10)});document.querySelector('#auto').onclick=()=>{auto=!auto};})();
</script></body></html>
